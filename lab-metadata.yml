# lab-metadata.yml
# Single Point of Truth for Lab Information

lab:
  name: "Security operations with Red Hat Hardened Images CVE scanning and image signing"
  shortname: "zt-scan-sign"
  maintainer: "Matt Micene (mmicene@redhat.com)" 
  
  description:
    summary: "In this lab you will explore Red Hat Hardeded Images through the lens of standard security tools"
    goal: "You'll look at the contents of an image for CVEs and software.
    You'll understand how images can have additional metadata attached in the registry"
    concepts:
      - "CVE scanning"
      - "SBOM management"
      - "Image signing and attestations"
      - "Supply chain custody"
      - "Build provenance (SLSA)"
    use_case: "Get familliar with the new Red Hat Hardened Images security model"
    time_to_complete: "32" # time in minutes
    
  # Git references for deployment
  # Use automated tag tied to a release for production, main for development
  git_ref:
    production: "prod"
    development: "main"

