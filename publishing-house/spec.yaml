spec:
  title: "Container Image Scanning, SBOMs, and Signing"
  learning_objectives:
    - "Scan container images using Grype to identify CVE exposure and compare vulnerability counts between a Red Hat Hardened Image and a UBI10-based image"
    - "Generate machine-readable SPDX-JSON SBOMs for container images using Syft and inspect package metadata, supplier data, and PURL references"
    - "Verify published cryptographic image signatures using Cosign against Red Hat's official public keys and inspect the in-toto envelope structure"
    - "Configure a per-student TLS-enabled OCI registry, push container images by immutable digest, and mirror a vendor image using Skopeo"
    - "Sign container images by digest using Cosign and verify OCI signature artifacts as a downstream consumer would"
    - "Attest a signed SBOM to a container image using cosign attest and verify the attestation envelope for offline inspection"
    - "Analyze vendor-published SLSA build provenance records to trace build identity, hermetic flag, and pinned input materials"
    - "Build a complete image supply chain trust model spanning scanning, SBOM generation, signing, and provenance attestation"
  modules:
    - id: module-01
      title: "Vulnerability Scanning Container Images"
      duration_min: 20
      status: not_started
    - id: module-02
      title: "Working with SBOMs"
      duration_min: 15
      status: not_started
    - id: module-03
      title: "Verifying Published Signatures"
      duration_min: 15
      status: not_started
    - id: module-04
      title: "Image Signing Setup (Push and Generate Keys)"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Image Signing and Verification"
      duration_min: 20
      status: not_started
    - id: module-06
      title: "Image SBOM Attestation"
      duration_min: 15
      status: not_started
    - id: module-07
      title: "Establishing Supply Chain Trust"
      duration_min: 15
      status: not_started
  # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
