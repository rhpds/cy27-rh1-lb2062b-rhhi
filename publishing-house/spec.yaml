    catalog_gap: "The existing catalog teaches supply chain security through enterprise OCP-native tooling (RHTAS, RHTPA, Tekton Chains on OpenShift). This lab fills a distinct gap: a RHEL VM-only, CLI-first, no-OCP lab that delivers the same core concepts — CVE scanning, SBOMs, image signing, and SLSA provenance inspection — using Grype, Syft, Cosign, and Skopeo, making it accessible to teams and learners who do not use OpenShift."
