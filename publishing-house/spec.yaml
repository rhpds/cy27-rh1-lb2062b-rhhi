# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A hands-on, Zero-Touch lab in which participants implement a full container image supply chain on a RHEL VM using Grype, Syft, Cosign, and Skopeo. The seven modules progress from CVE scanning and SBOM generation through image signing, OCI attestation, and inspection of Red Hat's own SLSA build provenance — building cumulative artifacts that form a complete per-student trust chain."
    module_summaries:
      - title: "Vulnerability Scanning Container Images"
        overview: "Learners enable the rootless Podman socket and use Grype to scan a pre-built Red Hat Hardened Image versus an equivalent UBI10-based image, demonstrating zero CVEs versus 252 for the UBI image and establishing the motivation for minimal base images."
      - title: "Working with SBOMs"
        overview: "Learners use Syft to generate a human-readable package table and a machine-readable SPDX-JSON SBOM for the hardened image, then inspect it with jq; the SBOM file is carried forward as a signed attestation in module-06."
      - title: "Verifying Published Signatures"
        overview: "Learners verify cryptographic signatures on Red Hat's published hardened and UBI images using Cosign against a remote public key URL and the local RHEL signing key, and inspect the in-toto envelope structure."
      - title: "Image Signing Setup (Push and Generate Keys)"
        overview: "Learners push their application image to a per-student TLS registry by digest, generate a Cosign key pair, and mirror a vendor image with Skopeo — observing an intentional failure that sets up the proof-of-origin gap closed in module-05."
      - title: "Image Signing and Verification"
        overview: "Learners sign their pushed image by digest using Cosign, verify the signature as a downstream consumer would, and close the mirror gap from module-04 by signing the vendor image under their own key pair."
      - title: "Image SBOM Attestation"
        overview: "Learners attach the SPDX SBOM from module-02 to their signed image as an OCI attestation using cosign attest, then verify and download the attestation envelope — completing the per-student trust chain."
      - title: "Establishing Supply Chain Trust"
        overview: "Learners download Red Hat's published attestation bundle for hi/python:3.12, discover it contains both an SPDX SBOM and a SLSA v0.2 build provenance record, and inspect the Tekton Chains builder identity, hermetic flag, and pinned input materials."
    rcars_overlap_pct: 80
    rcars_top_matches:
      - title: "Product Enablement: Red Hat Advanced Developer Suite on RHEL (TL3)"
        ci_name: "openshift-cnv.rhads-rhel-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.rhads-rhel-lab.prod"
        relevance_score: 80
        why_it_fits: "This lab covers several directly relevant topics including cosign image signing, SBOM generation with Syft, SLSA provenance attestations, and software supply chain security practices that align well with the request."
        workloads: []
      - title: "Build Secure, Streamlined Developer Workflows with Red Hat Advanced Developer Suite"
        ci_name: "published.rhads-secure-dev-workflows.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.rhads-secure-dev-workflows.prod"
        relevance_score: 77
        why_it_fits: "This workshop covers several overlapping topics including SBOM ingestion/analysis, Cosign-based keyless signing, SLSA provenance attestations, and container image vulnerability scanning, which align with the core skills the request targets."
        workloads:
          - role: "bootstrap"
            collection: "rhpds.build_secured_dev_workflows"
          - role: "trusted_artifact_signer"
            collection: "rhpds.build_secured_dev_workflows"
          - role: "trusted_profile_analyzer"
            collection: "rhpds.build_secured_dev_workflows"
      - title: "Product Enablement: Red Hat Advanced Developer Suite (TL3)"
        ci_name: "pert.redhat-rhads.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=pert.redhat-rhads.prod"
        relevance_score: 72
        why_it_fits: "This workshop includes modules on container image signing and verification, SBOM creation and management, provenance and attestations, and vulnerability management using Red Hat Trusted Artifact Signer and Trusted Profile Analyzer."
        workloads:
          - role: "ocp4_workload_cert_manager"
            collection: "agnosticd.core_workloads"
